name: Migrate database

# Applies pending migrations with `prisma migrate deploy`.
# `DATABASE_URL` comes from the secrets of the selected GitHub environment (for example `production`).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment that holds the DATABASE_URL secret
        required: true
        type: environment

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The pnpm version comes from the `packageManager` field in `package.json`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Task
        uses: arduino/setup-task@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Error: DATABASE_URL is not configured for this environment."
            exit 1
          fi

          echo "🚀 Applying migrations..."
          task db:deploy
          echo "✅ Migrations applied successfully 🎉"
