# Local PostgreSQL for development: `task db:up` / `task db:down`.
# The default `DATABASE_URL` in `.env.example` points at this service.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 images keep the cluster under /var/lib/postgresql (not .../data).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d app]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
