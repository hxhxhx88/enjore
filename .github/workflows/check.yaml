name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The pnpm version comes from the `packageManager` field in `package.json`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Task
        uses: arduino/setup-task@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check
        run: task check

      # `task check` extracts i18n catalogs and generates types; any leftover diff means a commit is missing.
      - name: Verify clean tree
        run: git diff --exit-code
