minimumReleaseAgeExcludePrune: true
# Supply-chain policies. pnpm 11+ defaults also apply: minimumReleaseAge (1 day), strictDepBuilds, blockExoticSubdeps.
trustPolicy: no-downgrade
# Legitimate backports published without provenance after provenance-enabled releases of the same package.
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

shellEmulator: true

packages:
  - 'apps/**'
  - 'packages/*'
  - 'configs/*'
  - 'examples/*'

# Dependencies with install scripts must be reviewed explicitly. Prisma downloads its engines and the hooks tool
# installs the commit hooks; the others ship prebuilt binaries.
allowBuilds:
  '@prisma/engines': true
  esbuild: false
  msw: false
  prisma: true
  sharp: false

  simple-git-hooks: true
# Every dependency version lives here; manifests reference them with "catalog:" (enforced by eslint-plugin-pnpm).
